<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fomr đăng kí</title>
    <link rel="stylesheet" href="exercise02.css" />
  </head>
  <body>
    <form class="form">
      <h1>Đăng ký</h1>
      <label for="ten">Tên</label>
      <input id="ten" type="text" name="Tên" placeholder=" Nguyễn Văn A" />
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="Email"
        placeholder="NguyenVanA@gmail.com"
      />
      <label for="matkhau">Mật khẩu</label>
      <input id="matkhau" type="password" name="Mật khẩu" />
      <button type="submit">Đăng Kí</button>
    </form>
  </body>
</html>
